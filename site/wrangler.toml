# offdesk.dev — static assets on Workers.
#
# Cloudflare's guidance for new projects is Workers rather than Pages; Pages
# still works but no longer gets the investment. There is no `main` here
# because nothing runs server-side: the Worker only serves ./dist.
#
# `wrangler deploy` creates the Worker on first run, so nothing has to be
# created in the dashboard beforehand.

name = "offdesk"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
