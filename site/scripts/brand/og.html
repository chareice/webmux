<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;background:#fff4e3;font-family:"Nunito",sans-serif;color:#2b2340}
  .sun{position:absolute;right:-160px;top:-240px;width:640px;height:640px;border-radius:50%;background:rgba(255,200,87,.6);filter:blur(60px)}
  .lagoon{position:absolute;left:-200px;bottom:-260px;width:520px;height:520px;border-radius:50%;background:rgba(94,211,193,.35);filter:blur(60px)}
  .logo{position:absolute;left:80px;top:70px;height:64px}
  h1{position:absolute;left:80px;top:200px;margin:0;width:880px;font-family:"Fredoka",sans-serif;font-weight:700;font-size:70px;line-height:1.04;letter-spacing:-.01em}
  p{position:absolute;left:80px;top:470px;margin:0;width:760px;font-size:26px;line-height:1.45;color:#4a4160;font-weight:500}
  .ring{position:absolute;left:1000px;top:400px;width:130px;height:130px;border-radius:50%;border:20px solid #ff6b57}
  .dot{position:absolute;left:940px;top:300px;width:60px;height:60px;border-radius:50%;background:#ff8fb1}
</style>
<div class="og"><div class="sun"></div><div class="lagoon"></div>
  <img class="logo" src="logo.svg">
  <h1>Your terminal stays home. You don't have to.</h1>
  <p>Vibe code from your phone, on the terminal you left at home.</p>
  <div class="dot"></div><div class="ring"></div>
</div>
