name: Desktop Build

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux ship offdesk-hub and offdesk-node inside the app
        # (macOS tmux too), so the app can make its machine the hub. The
        # sidecar list lives in a config the release build merges in, so a
        # plain `tauri dev` needs none of them. Windows is a client only.
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin --config src-tauri/tauri.sidecars.macos.conf.json"
            sidecars: "--universal"
          - platform: ubuntu-22.04
            args: "--config src-tauri/tauri.sidecars.linux.conf.json"
            sidecars: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The hub sidecar bakes the web UI in, so the UI is built before it;
      # tauri-action's beforeBuildCommand builds it again, to the same result.
      - name: Build the web UI for the hub sidecar
        if: matrix.platform != 'windows-latest'
        run: pnpm --filter @offdesk/shared build && pnpm --filter @offdesk/app build

      - name: Build the offdesk-hub and offdesk-node sidecars
        if: matrix.platform != 'windows-latest'
        run: scripts/desktop-sidecars.sh ${{ matrix.sidecars }}

      - name: Build the tmux sidecar
        if: matrix.platform == 'macos-latest'
        run: scripts/build-tmux-sidecar.sh packages/desktop/src-tauri/binaries

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: desktop-v__VERSION__
          releaseName: "Desktop v__VERSION__"
          releaseBody: "See the assets to download the desktop app for your platform."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
