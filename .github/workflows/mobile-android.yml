name: Build Android APK (Tauri)

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:
    inputs:
      hub_url:
        description: "Optional: preset this hub instead of asking on first launch. Leave empty for a public build."
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    env:
      # Empty on purpose for released builds: the app asks for a hub on first
      # launch, so one APK works for everyone. A dispatch can preset a hub for
      # a private build.
      OFFDESK_MOBILE_HUB_URL: ${{ github.event.inputs.hub_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.1.12297006"

      - name: Cache Cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}

      - name: Cache Rust target dir
        uses: actions/cache@v4
        with:
          path: packages/desktop/src-tauri/target
          key: cargo-target-android-${{ runner.os }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}

      - name: Install Rust toolchain + Android targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          cargo install tauri-cli --version "^2.0" --locked

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false

      - name: Build shared package
        run: pnpm --filter @offdesk/shared build

      - name: Build web bundle (loaded as launch shell, replaced at runtime)
        run: pnpm --filter @offdesk/app build

      - name: Set release version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME:-app-vlocal}"
          version="${tag#app-v}"
          if [ "$version" = "$tag" ]; then version="0.1.0"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Sync versionCode / versionName into tauri.properties
        working-directory: packages/desktop/src-tauri/gen/android
        run: |
          version="${{ steps.version.outputs.version }}"
          # Treat the version's numeric components as the versionCode: turn
          # X.Y.Z into XXYYZZ so monotonic ordering matches semver intent.
          numeric=$(echo "$version" | awk -F. '{ printf "%d%02d%02d", $1, $2, $3 }')
          mkdir -p app
          cat > app/tauri.properties <<EOF
          tauri.android.versionCode=$numeric
          tauri.android.versionName=$version
          EOF
          cat app/tauri.properties

      - name: Decode release keystore
        working-directory: packages/desktop/src-tauri/gen/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required for Android releases." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      # Inject the release signing config + per-ABI splits. Mirrors the
      # patch the old Expo workflow applied; build.gradle.kts on the Tauri
      # template doesn't ship a signing block we can fill via env alone.
      - name: Patch app/build.gradle.kts (signing + ABI splits)
        working-directory: packages/desktop/src-tauri/gen/android
        run: |
          python3 - <<'PY'
          import re, pathlib
          path = pathlib.Path("app/build.gradle.kts")
          src = path.read_text()

          signing_block = """
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }
          """
          src = re.sub(r"android\s*\{", "android {" + signing_block, src, count=1)

          # Hook the release buildType to use our signingConfig. The
          # generated template's release block already declares a
          # `signingConfig signingConfigs.getByName("debug")` line we can
          # swap for ours.
          new_src, n = re.subn(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              src,
              count=1,
          )
          if n == 0:
              # Older templates: just inject one inside release { ... }
              new_src, n = re.subn(
                  r'getByName\("release"\)\s*\{',
                  'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")',
                  src,
                  count=1,
              )
              if n == 0:
                  raise SystemExit("Couldn't find release buildType to patch")
          src = new_src

          # Per-ABI splits — universal APK plus one per ABI keeps each
          # file ~50MB instead of one ~190MB blob.
          splits_block = """
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a", "armeabi-v7a", "x86_64")
                      isUniversalApk = true
                  }
              }
          """
          src = src.replace("android {" + signing_block,
                            "android {" + signing_block + splits_block,
                            1)

          path.write_text(src)
          print("Patched build.gradle.kts")
          PY

      - name: Build release APKs via cargo tauri
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        working-directory: packages/desktop
        run: |
          source "$HOME/.cargo/env"
          cargo tauri android build --apk

      - name: Collect APKs
        id: apks
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          for src in $(find packages/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*-release*.apk"); do
            base=$(basename "$src" .apk)
            abi=$(echo "$base" | sed -E 's/^app-//; s/-release.*$//')
            [ -z "$abi" ] && abi="universal"
            cp "$src" "artifacts/offdesk-${version}-${abi}.apk"
          done
          ls -lh artifacts/
          {
            echo "files<<EOF"
            ls artifacts/*.apk
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offdesk-android-apks
          path: artifacts/*.apk

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Mobile ${tag}" \
              --notes "Tauri-based Android client. Sideload via 'install from unknown sources'. Pick the **arm64-v8a** APK on modern phones; the **universal** APK works on any architecture but is larger. On first launch the app asks for your hub's address; everything after that — the whole UI — comes from your hub, so new features arrive without a new APK."
          fi
          for apk in artifacts/*.apk; do
            gh release upload "$tag" "$apk" --clobber
          done
