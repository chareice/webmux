name: Build Android APK

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    # Hoisted layout — Expo's autolinking + React Native's gradle plugin
    # walk node_modules expecting a flat-ish tree. Strict pnpm symlinks
    # work for the web build but the gradle plugin needs flat-ish.
    env:
      NPM_CONFIG_NODE_LINKER: hoisted

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.1.12297006"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared package
        run: pnpm --filter @webmux/shared build

      - name: Generate native android project
        working-directory: packages/app
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="0.1.0"
          fi
          WEBMUX_APP_VERSION="$version" pnpm exec expo prebuild --platform android --no-install

      # App-side updates only work when each release is signed with the
      # same key. These secrets hold the stable Webmux Android signing key.
      - name: Decode release keystore
        working-directory: packages/app/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name secret is required for Android releases." >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      # Patch build.gradle to:
      #   1. Add a release signing config that points at our keystore
      #   2. Enable per-ABI APK splits so each output APK is ~50MB
      #      instead of one ~190MB universal blob (debug-mode splits
      #      were off; we turn them on for our release variant)
      - name: Patch build.gradle for release signing + abi splits
        working-directory: packages/app/android/app
        run: |
          python3 - <<'PY'
          import re
          path = "build.gradle"
          gradle = open(path).read()

          # 1. Insert a release signingConfig referencing the generated keystore.
          #    Explicitly enable v1, v2, v3 signing schemes. AGP's auto-logic
          #    disables v1 when minSdk >= 24, leaving v2-only — which some
          #    Samsung devices on Android 13+ reject as "package appears
          #    invalid". Including v1 + v2 + v3 covers everything from
          #    Android 7 (API 24) through Android 16 cleanly.
          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }
              }
          """
          # Drop into the android { ... } block right after the opening brace.
          gradle = re.sub(r"android\s*\{", "android {" + signing_block, gradle, count=1)

          # 2. Make the release buildType actually use that signingConfig.
          #    Anchor on `release {` directly — anchoring on `buildTypes {`
          #    fails because the intermediate `debug { ... }` block ends
          #    in `}`, which `[^}]*` doesn't cross.
          new_gradle, n = re.subn(
              r"(release\s*\{[^}]*?)signingConfig\s+signingConfigs\.\w+",
              r"\1signingConfig signingConfigs.release",
              gradle,
              count=1,
              flags=re.DOTALL,
          )
          if n == 0:
              raise SystemExit(
                  "Could not find `release { ... signingConfig signingConfigs.X }` "
                  "in build.gradle — expo prebuild template may have changed."
              )
          gradle = new_gradle

          # 3. Enable per-ABI splits (one APK per architecture, plus a
          #    universal one we can fall back to). Lives at android level.
          splits_block = """
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                      universalApk true
                  }
              }
          """
          # Append before the closing brace of android { ... }. Find the LAST }
          # that matches the android block.
          # Simpler: insert before "// React Native settings" or right at the
          # top of android — but easiest is to append at the start of the block.
          gradle = gradle.replace(
              "android {" + signing_block,
              "android {" + signing_block + splits_block,
              1,
          )

          open(path, "w").write(gradle)
          print("Patched build.gradle. Signing + splits config injected.")
          PY

      - name: Build release APKs
        working-directory: packages/app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        id: apks
        run: |
          tag="${GITHUB_REF_NAME:-app-vlocal}"
          version="${tag#app-v}"
          mkdir -p artifacts
          # Each ABI gets its own APK plus there's a universal one. Rename
          # them with the version + ABI suffix for clarity in the release.
          for src in $(find packages/app/android/app/build/outputs/apk/release -name "*.apk"); do
            base=$(basename "$src" .apk)
            # name pattern: app-<abi>-release.apk or app-universal-release.apk
            abi=$(echo "$base" | sed -E 's/^app-//; s/-release$//')
            cp "$src" "artifacts/webmux-${version}-${abi}.apk"
          done
          ls -lh artifacts/
          {
            echo "files<<EOF"
            ls artifacts/*.apk
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webmux-android-apks
          path: artifacts/*.apk

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Mobile ${tag}" \
              --notes "Sideload via 'install from unknown sources'. Most modern phones: pick the **arm64-v8a** APK. The **universal** APK works on any architecture but is larger. If you installed an older APK from before stable signing, uninstall it once before installing this release; future app-side updates can install over it."
          fi
          for apk in artifacts/*.apk; do
            gh release upload "$tag" "$apk" --clobber
          done
