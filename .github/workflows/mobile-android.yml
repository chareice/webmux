name: Build Android APK

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    # Hoisted layout — Expo's autolinking + React Native's gradle plugin
    # walk node_modules expecting a flat-ish tree. Strict pnpm symlinks
    # work for the web build but the gradle plugin needs flat-ish.
    env:
      NPM_CONFIG_NODE_LINKER: hoisted

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build shared package
        run: pnpm --filter @webmux/shared build

      - name: Generate native android project
        working-directory: packages/app
        run: npx expo prebuild --platform android --no-install

      # Some Samsung phones reject the well-known Android Debug keystore
      # (CN=Android Debug) because malware has historically abused it.
      # Generate a unique self-signed release keystore per build so the
      # APK is signed with a never-before-seen key. Trade-off: every
      # build has a different signature, so users must uninstall the
      # previous version before installing a new one. Acceptable for
      # solo / small-team distribution; if/when we need stable signing,
      # move the keystore (base64) into a repo secret.
      - name: Generate release keystore
        working-directory: packages/app/android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias webmux-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass webmux-release \
            -keypass webmux-release \
            -dname "CN=webmux, OU=app, O=chareice, L=Beijing, S=Beijing, C=CN"

      # Patch build.gradle to:
      #   1. Add a release signing config that points at our keystore
      #   2. Enable per-ABI APK splits so each output APK is ~50MB
      #      instead of one ~190MB universal blob (debug-mode splits
      #      were off; we turn them on for our release variant)
      - name: Patch build.gradle for release signing + abi splits
        working-directory: packages/app/android/app
        run: |
          python3 - <<'PY'
          import re
          path = "build.gradle"
          gradle = open(path).read()

          # 1. Insert a release signingConfig referencing the generated keystore.
          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'webmux-release'
                      keyAlias 'webmux-release'
                      keyPassword 'webmux-release'
                  }
              }
          """
          # Drop into the android { ... } block right after the opening brace.
          gradle = re.sub(r"android\s*\{", "android {" + signing_block, gradle, count=1)

          # 2. Make the release buildType actually use that signingConfig and
          #    drop the default debug fallback. Expo's template usually has
          #    `signingConfig signingConfigs.debug` — replace it.
          gradle = re.sub(
              r"(buildTypes\s*\{[^}]*release\s*\{[^}]*?)signingConfig\s+signingConfigs\.\w+",
              r"\1signingConfig signingConfigs.release",
              gradle,
              flags=re.DOTALL,
          )

          # 3. Enable per-ABI splits (one APK per architecture, plus a
          #    universal one we can fall back to). Lives at android level.
          splits_block = """
              splits {
                  abi {
                      enable true
                      reset()
                      include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
                      universalApk true
                  }
              }
          """
          # Append before the closing brace of android { ... }. Find the LAST }
          # that matches the android block.
          # Simpler: insert before "// React Native settings" or right at the
          # top of android — but easiest is to append at the start of the block.
          gradle = gradle.replace(
              "android {" + signing_block,
              "android {" + signing_block + splits_block,
              1,
          )

          open(path, "w").write(gradle)
          print("Patched build.gradle. Signing + splits config injected.")
          PY

      - name: Build release APKs
        working-directory: packages/app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        id: apks
        run: |
          tag="${GITHUB_REF_NAME:-app-vlocal}"
          version="${tag#app-v}"
          mkdir -p artifacts
          # Each ABI gets its own APK plus there's a universal one. Rename
          # them with the version + ABI suffix for clarity in the release.
          for src in $(find packages/app/android/app/build/outputs/apk/release -name "*.apk"); do
            base=$(basename "$src" .apk)
            # name pattern: app-<abi>-release.apk or app-universal-release.apk
            abi=$(echo "$base" | sed -E 's/^app-//; s/-release$//')
            cp "$src" "artifacts/webmux-${version}-${abi}.apk"
          done
          ls -lh artifacts/
          {
            echo "files<<EOF"
            ls artifacts/*.apk
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webmux-android-apks
          path: artifacts/*.apk

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Mobile ${tag}" \
              --notes "Sideload via 'install from unknown sources'. Most modern phones: pick the **arm64-v8a** APK. The **universal** APK works on any architecture but is larger. Note: each release is signed with a fresh keystore, so you must uninstall the previous version before installing a new one."
          fi
          for apk in artifacts/*.apk; do
            gh release upload "$tag" "$apk" --clobber
          done
